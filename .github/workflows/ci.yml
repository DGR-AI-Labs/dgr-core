name: CI

# Phase 1 CI. Governance and the canonical Rust bypass harness must stay green.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Expected: PASS. Validates the governance spine and README disclaimers.
  structure:
    name: Structural / governance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Structural check
        run: node scripts/check-structure.mjs

  rust-bypass:
    name: Rust format / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        run: cargo fmt --manifest-path Cargo.toml --all -- --check
      - name: Build Rust workspace
        run: cargo build --workspace --all-targets --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Prepare isolated issuer test environment
        shell: bash
        run: |
          set -euo pipefail
          # The real syscall fixtures require trusted ancestors, including HOME.
          # Log public runner metadata before changing this disposable runner only.
          id
          namei -l "$HOME"
          stat -f -c 'home filesystem: %T' "$HOME"
          python3 - <<'PYTHON'
          import os
          import pathlib
          import stat
          root = pathlib.Path.home()
          uid, gid = os.getuid(), os.getgid()
          if uid == 0 or gid == 0:
              raise SystemExit("issuer tests require non-root UID/GID")
          entry = root.lstat()
          if not stat.S_ISDIR(entry.st_mode) or entry.st_uid != uid:
              raise SystemExit("runner HOME must be a real directory owned by the test user")
          # Do not relax product checks or modify other ancestors.
          root.chmod(stat.S_IMODE(entry.st_mode) & ~0o6022)
          for path in [root, *root.parents]:
              entry = path.lstat()
              print(f"ancestor {path}: uid={entry.st_uid} gid={entry.st_gid} mode={stat.S_IMODE(entry.st_mode):04o}")
              fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW)
              try:
                  fdinfo = pathlib.Path(f"/proc/self/fdinfo/{fd}").read_text()
                  mount_id = next(line for line in fdinfo.splitlines() if line.startswith("mnt_id:"))
                  print(f"ancestor {path}: {mount_id}")
                  for attr in ("system.posix_acl_access", "system.posix_acl_default"):
                      try:
                          value = os.getxattr(fd, attr)
                          print(f"ancestor {path}: {attr} present, bytes={len(value)}")
                      except OSError as error:
                          print(f"ancestor {path}: {attr} errno={error.errno}")
              finally:
                  os.close(fd)
              if (not stat.S_ISDIR(entry.st_mode)
                      or entry.st_uid not in (0, uid)
                      or entry.st_mode & 0o6022):
                  raise SystemExit("runner ancestor does not satisfy issuer test policy")
          PYTHON
          issuer_test_tmp="$(mktemp -d "$RUNNER_TEMP/dgr-issuer-tests.XXXXXX")"
          chmod 0700 "$issuer_test_tmp"
          printf 'TMPDIR=%s\n' "$issuer_test_tmp" >> "$GITHUB_ENV"
      - name: Remove default ACL from disposable runner parent
        shell: bash
        run: |
          set -euo pipefail
          # Hosted image /home has a default ACL; the issuer correctly rejects it.
          # Normalize this one disposable test-host directory, not product policy.
          sudo python3 - <<'PYTHON'
          import errno
          import os
          import stat
          fd = os.open("/home", os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW)
          try:
              entry = os.fstat(fd)
              if entry.st_uid != 0 or entry.st_mode & 0o6022:
                  raise SystemExit("unexpected /home owner or mode")
              try:
                  value = os.getxattr(fd, "system.posix_acl_default")
              except OSError as error:
                  if error.errno != errno.ENODATA:
                      raise
                  print("/home default ACL already absent")
              else:
                  print(f"removing /home default ACL: {len(value)} bytes")
                  os.removexattr(fd, "system.posix_acl_default")
              for attr in ("system.posix_acl_access", "system.posix_acl_default"):
                  try:
                      os.getxattr(fd, attr)
                  except OSError as error:
                      if error.errno != errno.ENODATA:
                          raise
                      print(f"/home {attr}: ENODATA")
                  else:
                      raise SystemExit("/home still has a POSIX ACL")
          finally:
              os.close(fd)
          PYTHON
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test ignored-set comparison logic
        run: node scripts/check-ignored-attacks.test.mjs
      - name: Verify exact deferred and external attack set
        run: node scripts/check-ignored-attacks.mjs

  # ---------------------------------------------------------------------------
  # INFORMATIONAL ONLY. These jobs are deliberately non-blocking and must not be
  # configured as required status checks. The blocking T0 gate remains FND-7's
  # exact-commit, founder-dispositioned Semgrep, CodeQL, and cargo-deny evidence.
  # Known reviewed output: Semgrep test-only temp-dir; CodeQL deterministic
  # fixture nonces plus diagnostic-only path-resolution notes; cargo-deny clean
  # with two reviewed duplicate-version skips and no advisory ignores.
  # No baseline or suppression policy may be introduced without founder review.
  # ---------------------------------------------------------------------------

  informational-semgrep:
    name: Informational SAST / Semgrep (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: python -m pip install semgrep==1.173.0
      - name: Scan the Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rust_files < <(git ls-files -- '*.rs')
          if (( ${#rust_files[@]} == 0 )); then
            echo "Semgrep coverage failure: no tracked Rust files found" >&2
            exit 1
          fi
          printf 'Semgrep tracked Rust targets: %s\n' "${#rust_files[@]}"
          semgrep scan --config p/rust --error --no-git-ignore "${rust_files[@]}"

  informational-codeql:
    name: Informational SAST / CodeQL (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL for Rust
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-extended
      - name: Build the Rust workspace for CodeQL
        run: cargo build --workspace --all-targets --locked
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  informational-cargo-deny:
    name: Informational SCA / cargo-deny (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.94.1"
          manifest-path: Cargo.toml
          command: check
          arguments: --config deny.toml --locked --workspace
          command-arguments: --show-stats
