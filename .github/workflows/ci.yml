name: CI

# Phase 0 (spine only). This workflow is INTENTIONALLY RED.
#
#   - `structure` is expected to PASS (governance spine present, README disclaimers).
#   - `bypass-suite` is expected to FAIL: nothing is implemented, so the bypass
#     tests (which assert the secure outcome) cannot pass. That red state is the
#     correct, fail-closed-by-absence signal for Phase 0.
#
# Do NOT mark `bypass-suite` as a required status check. Flipping it to required
# is a deliberate, later, HUMAN step taken only once a real gate exists and the
# suite legitimately goes green.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Expected: PASS. Validates the governance spine and README disclaimers.
  structure:
    name: Structural / governance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Structural check
        run: node scripts/check-structure.mjs

  # Expected: FAIL (red by design) in Phase 0. See tests/bypass/README.md.
  # green = enforcement proven. NOT a required status check (see header).
  bypass-suite:
    name: Bypass suite (red by design until enforcement exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run bypass suite
        # No continue-on-error: this job SHOULD report failure in Phase 0.
        run: node --test tests/bypass

