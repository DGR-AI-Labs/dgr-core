name: CI

# Phase 1 CI. Governance and the canonical Rust bypass harness must stay green.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Expected: PASS. Validates the governance spine and README disclaimers.
  structure:
    name: Structural / governance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Structural check
        run: node scripts/check-structure.mjs

  rust-bypass:
    name: Rust format / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        run: cargo fmt --manifest-path Cargo.toml --all -- --check
      - name: Build Rust workspace
        run: cargo build --workspace --all-targets --locked
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test ignored-set comparison logic
        run: node scripts/check-ignored-attacks.test.mjs
      - name: Verify exact deferred and external attack set
        run: node scripts/check-ignored-attacks.mjs

  # ---------------------------------------------------------------------------
  # INFORMATIONAL ONLY. These jobs are deliberately non-blocking and must not be
  # configured as required status checks. The blocking T0 gate remains FND-7's
  # exact-commit, founder-dispositioned Semgrep, CodeQL, and cargo-deny evidence.
  # Known reviewed output: Semgrep test-only temp-dir; CodeQL deterministic
  # fixture nonces plus diagnostic-only path-resolution notes; cargo-deny clean
  # with two reviewed duplicate-version skips and no advisory ignores.
  # No baseline or suppression policy may be introduced without founder review.
  # ---------------------------------------------------------------------------

  informational-semgrep:
    name: Informational SAST / Semgrep (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: python -m pip install semgrep==1.173.0
      - name: Scan the Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rust_files < <(git ls-files -- '*.rs')
          if (( ${#rust_files[@]} == 0 )); then
            echo "Semgrep coverage failure: no tracked Rust files found" >&2
            exit 1
          fi
          printf 'Semgrep tracked Rust targets: %s\n' "${#rust_files[@]}"
          semgrep scan --config p/rust --error --no-git-ignore "${rust_files[@]}"

  informational-codeql:
    name: Informational SAST / CodeQL (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL for Rust
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-extended
      - name: Build the Rust workspace for CodeQL
        run: cargo build --workspace --all-targets --locked
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  informational-cargo-deny:
    name: Informational SCA / cargo-deny (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.94.1"
          manifest-path: Cargo.toml
          command: check
          arguments: --config deny.toml --locked --workspace
          command-arguments: --show-stats
