name: CI

# Phase 1. Path-filtered so each package builds/tests independently, plus a
# structural/governance check and the bypass suite.
#
# IMPORTANT: `bypass-suite` passes ONLY if the T0 enforcement draft is correct,
# and even a green run does NOT mean enforcement is proven (the T0 human gate —
# human review + cross-model review + ≥3 SAST + adversarial test — must pass
# first). Do NOT mark `bypass-suite` as a required status check here; that flip
# is a deliberate, later, HUMAN step.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      adapter: ${{ steps.filter.outputs.adapter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/core/**'
              - 'tests/bypass/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
            adapter:
              - 'packages/adapter-openclaw/**'
              - 'packages/core/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vitest.config.ts'

  structure:
    name: Structural / governance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-structure.mjs

  core:
    name: "@dgr/core — build + test"
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install
      - run: pnpm --filter @dgr/core build
      # Tests run from the repo root so the root vitest config (which aliases
      # @dgr/* to source) applies; the positional arg scopes to this package.
      - run: pnpm exec vitest run packages/core

  adapter:
    name: "@dgr/openclaw — build + test"
    needs: changes
    if: ${{ needs.changes.outputs.adapter == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install
      - run: pnpm --filter @dgr/openclaw build
      - run: pnpm exec vitest run packages/adapter-openclaw

  bypass-suite:
    name: Bypass suite (green only if T0 draft is correct; NOT a required check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install
      - run: pnpm test:bypass

  # ---------------------------------------------------------------------------
  # PHASE 1 T0 GATE — SAST (>=3 tools). NOT enabled here on purpose.
  #
  # Per Constitution P8, T0 enforcement-critical code requires >=3 SAST tools as
  # part of the human-led review gate. Wiring real scanners (and acting on their
  # findings) is part of that human gate, not something this PR should fake.
