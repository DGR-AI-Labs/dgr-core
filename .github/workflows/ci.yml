name: CI

# Phase 1 CI. Governance and the canonical Rust bypass harness must stay green.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Expected: PASS. Validates the governance spine and README disclaimers.
  structure:
    name: Structural / governance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Structural check
        run: node scripts/check-structure.mjs

  rust-bypass:
    name: Rust format / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tests/bypass-rust/Cargo.toml --all -- --check
      - name: Build Rust bypass harness
        run: cargo build --manifest-path tests/bypass-rust/Cargo.toml --all-targets --locked
      - name: Test Rust bypass harness
        run: cargo test --manifest-path tests/bypass-rust/Cargo.toml --all-targets --locked

